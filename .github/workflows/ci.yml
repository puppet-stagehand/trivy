---
# STAGEHAND-OWNED, NOT MODULESYNC-MANAGED. The `puppet` dependency-
# resolution matrix and `openvox9-beta` job below are this file's
# original modulesync-generated content (kept, not replaced -- D-02
# preserves target evolution, and openvox9-beta's bundle-based repro of a
# real puppet-resource_api version conflict is trivy-specific, more
# precise than a generic reusable-workflow leg, and stays as-is). The
# `security`, `lint`, `unit-test`, `acceptance`, `task-tests`,
# `pdk-build-and-package`, and `reference-drift` jobs were added here to
# normalize this file to the same blocking-fan-in shape
# puppet-stagehand/stagehand (04.1-02) and puppet-stagehand/patchbot
# (04.1-03) already proved, adapted for trivy's task-only (no
# manifests/classes) shape (04.1-04-PLAN.md Task 2, D-16). A future
# modulesync run would revert the dependency-resolution/openvox9-beta
# jobs to their stock shape -- if that happens, re-apply this
# normalization the same way puppet9-acceptance.yml/security.yml's own
# headers already document for their pieces.
#
# Blocking vs experimental, per D-16: puppet7/puppet8/openvox8 are the
# real, GA collections this module declares support for (metadata.json
# requirements: puppet >= 7.0.0 < 9.0.0, openvox >= 8.0.0 < 10.0.0) and
# block the PR. puppet9 has no puppet gem yet (rubygems.org tops out at
# 8.10.0); openvox9 exists only as a beta prerelease. Both remain
# explicitly named, non-blocking, best-effort legs until a stable
# toolchain exists -- never silently folded into the required matrix, and
# never silently dropped either.
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      beaker_staging_url:
        description: |-
          URL to a staging Server to test unreleased packages.
          We will append the version to the Server and assume all packages are in the same directory.
          Only supported for AIO packages.
        required: false
        type: string
        default: 'https://artifacts.voxpupuli.org/openvox-agent'
      beaker_collection:
        description: |-
          When set to staging, we will download the packages from staging_url.
          Otherwise we will use the official repos. Supported values: puppet7, puppet8, openvox7, openvox8, staging.
          When unset, we will generate a list of supported collections based on metadata.json.
        required: false
        type: string
      beaker_staging_version:
        description: |-
          The package version we want to test.
          Only used for beaker_collection = staging
        required: false
        type: string

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Repo security scan (bundler-audit + Trivy filesystem)
    uses: ./.github/workflows/security.yml

  lint:
    name: Lint / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: puppet-lint + syntax + metadata-json-lint
        run: bundle exec rake validate lint metadata_lint

  unit-test:
    name: rspec (${{ matrix.label }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real, resolvable releases -- these block the PR.
          - label: "Puppet Core 7"
            gem_name: puppet
            gem_version: "~> 7.0"
            ruby_version: "3.2"
            experimental: false
          - label: "Puppet Core 8"
            gem_name: puppet
            gem_version: "~> 8.0"
            ruby_version: "3.2"
            experimental: false
          - label: "OpenVox 8"
            gem_name: openvox
            gem_version: "~> 8.0"
            ruby_version: "3.2"
            experimental: false
          # Puppet 9 has not shipped on RubyGems yet -- real leg, wired in,
          # can only start passing once Puppet 9 actually ships (see this
          # file's header and puppet9-acceptance.yml for the real-package
          # compile-check path).
          - label: "Puppet Core 9 (experimental -- not yet released)"
            gem_name: puppet
            gem_version: "~> 9.0"
            ruby_version: "3.2"
            experimental: true
          # OpenVox 9 exists only as a pre-release -- forward-compat
          # signal, not a support commitment.
          - label: "OpenVox 9 (experimental -- pre-release)"
            gem_name: openvox
            gem_version: ">= 9.0.0.beta1"
            ruby_version: "3.2"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      CI_PUPPET_GEM_NAME: ${{ matrix.gem_name }}
      CI_PUPPET_GEM_VERSION: ${{ matrix.gem_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby_version }}

      - name: bundle install (fresh per matrix leg)
        # Each leg resolves its own gem graph for CI_PUPPET_GEM_NAME/
        # VERSION -- the committed local Gemfile.lock (gitignored, dev-
        # machine only) is never touched here.
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3

      - name: rspec (task/adapter unit contracts -- this module has no manifests to compile)
        # This module is Bolt-task-only (no classes/defines), so there is
        # no Puppet catalog to compile per Puppet-version leg -- spec/unit
        # covers task metadata/behavior contracts and the trivy-report.sh
        # adapter directly. spec/acceptance is covered by its own job
        # below since it exercises a real subprocess and does not need to
        # run once per Puppet-version leg.
        run: |
          bundle exec rake fixtures:prep
          bundle exec rspec spec/unit

  acceptance:
    name: Acceptance (target-native, real subprocess)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: rspec (spec/acceptance -- real trivy_scan.sh subprocess, real jq, stubbed trivy/curl/puppet)
        run: bundle exec rspec spec/acceptance

  task-tests:
    name: Bolt task shell tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run tasks/*_test.sh and tests/*.sh
        run: |
          set -eu
          status=0
          for t in tasks/*_test.sh tests/*.sh; do
            [ -f "$t" ] || continue
            echo "== $t =="
            sh "$t" || status=1
          done
          exit "$status"

  # FORGE-01: `pdk build` packages metadata.json + the module's declared
  # files into an installable tarball independent of `pdk validate`'s
  # compatibility gate. `pdk validate` is NOT wired in here -- it
  # unconditionally fails with "This module is not PDK compatible" against
  # this repo's voxpupuli/modulesync toolchain (Gemfile/Rakefile), and
  # `pdk convert --force` destroys that working toolchain (same
  # documented, shared gap as puppet-stagehand/stagehand and
  # puppet-stagehand/patchbot -- see 04.1-03-SUMMARY.md and
  # 04.1-04-SUMMARY.md). Inspects the resulting tarball's name/version/
  # file manifest so a malformed or incomplete package fails CI instead
  # of only surfacing at publish time.
  pdk-build-and-package:
    name: PDK build + package inspection (FORGE-01)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PDK (apt.puppet.com, sha256-pinned repo package)
        run: |
          set -euo pipefail
          curl -fsSL https://apt.puppet.com/puppet-tools-release-noble.deb -o /tmp/puppet-tools-release.deb
          echo "9c077ffd3a3c1802d04f3623dfcb8eb0ae7486fe29f2053a2ce9aa1cc3b59383  /tmp/puppet-tools-release.deb" | sha256sum -c -
          sudo dpkg -i /tmp/puppet-tools-release.deb
          sudo apt-get update
          sudo apt-get install -y pdk=3.4.0.1-1noble

      - name: pdk build
        run: pdk build --force

      - name: Inspect built package (name, version, expected file manifest)
        run: |
          set -eu
          name=$(jq -r '.name' metadata.json)
          version=$(jq -r '.version' metadata.json)
          pkg="pkg/${name}-${version}.tar.gz"
          [ -f "$pkg" ] || { echo "::error::expected package not found: $pkg"; exit 1; }
          echo ">>> package: $pkg"
          sha256sum "$pkg"
          echo ">>> manifest:"
          tar tzf "$pkg" | sed -n '1,50p'
          tar tzf "$pkg" | grep -q "${name}-${version}/metadata.json" \
            || { echo "::error::package is missing metadata.json at its expected path"; exit 1; }
          tar tzf "$pkg" | grep -q "${name}-${version}/tasks/trivy_scan.json" \
            || { echo "::error::package is missing tasks/trivy_scan.json"; exit 1; }
          tar tzf "$pkg" | grep -q "${name}-${version}/files/trivy-report.sh" \
            || { echo "::error::package is missing files/trivy-report.sh"; exit 1; }

  # POLISH-03: REFERENCE.md must be generated, committed, and never allowed
  # to silently drift from the manifests/tasks it documents.
  reference-drift:
    name: REFERENCE.md drift gate (POLISH-03)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Regenerate REFERENCE.md and fail on drift
        run: |
          bundle exec puppet strings generate --format markdown
          git diff --exit-code -- REFERENCE.md

  puppet:
    name: ${{ matrix.collection }} dependency resolution
    strategy:
      fail-fast: false
      matrix:
        collection:
          - puppet7
          - puppet8
          - openvox8
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4
    with:
      rubocop: false
      beaker_staging_url: ${{ inputs.beaker_staging_url }}
      beaker_collection: ${{ inputs.beaker_collection || matrix.collection }}
      beaker_staging_version: ${{ inputs.beaker_staging_version }}

  # openvox9 is real (apt/yum.voxpupuli.org's openvox9 repo, and the openvox
  # RubyGem publishes pre-releases through 9.0.0.pre.beta2) but is beta-only
  # upstream -- OpenVox's own 2026-07-15 announcement says not to recommend
  # it for production. voxpupuli/gha-puppet's beaker.yml@v4 also does not
  # know "openvox9" as a beaker_collection value at all (its documented set
  # is puppet7/puppet8/openvox7/openvox8/staging only), so this job cannot
  # use the shared reusable workflow the way the blocking matrix above does.
  # It runs a best-effort local compile/spec check against the openvox gem's
  # beta prerelease instead, and is explicitly non-blocking:
  #   - continue-on-error: true, so a failure here never fails the CI check.
  #   - not part of the `puppet` matrix above, so it can't affect branch
  #     protection status checks keyed to that job name.
  #
  # EMPIRICALLY VERIFIED (2026-08-21): this job is expected to fail its
  # `bundle install` step today, for a structural reason that goes beyond
  # "it's beta". `bundle lock --update openvox` against any openvox
  # >= 8.24.0 (which covers every 9.x prerelease through 9.0.0.pre.beta2)
  # always fails dependency resolution with:
  #   openvox >= 8.24.0 depends on puppet-resource_api ~> 2.0, and
  #   puppet_litmus >= 2.4.0 (via bolt >= 2.36.0) depends on puppet
  #   >= 6.18.0, which depends on puppet-resource_api ~> 1.5.
  # openvox's puppet-resource_api 2.x requirement is incompatible with this
  # Gemfile's puppet_litmus/bolt dependency chain, which pulls the `puppet`
  # gem (resource_api ~> 1.5) in regardless of whether `puppet` is also
  # explicitly pinned -- `bundle config set --without system_tests` does
  # NOT dodge this either, since `bundle lock` resolves every group's
  # dependency graph up front regardless of --without.
  # This is tracking-only until either openvox9 goes GA and gha-puppet adds
  # native support for it, or puppet_litmus/bolt ship a puppet-resource_api
  # 2.x-compatible release -- whichever lands first.
  openvox9-beta:
    name: openvox9 (beta, best-effort, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: bundle install against the openvox 9.x beta prerelease gem
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          OPENVOX_GEM_VERSION: '>= 9.0.0.pre.beta1'
        run: |
          set -euo pipefail
          gem install bundler --no-document
          bundle config set --local path 'vendor/bundle'
          bundle lock --update openvox || true
          bundle install
      - name: bundle exec rake spec (informational only -- see job comment)
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          OPENVOX_GEM_VERSION: '>= 9.0.0.pre.beta1'
        run: bundle exec rake spec
